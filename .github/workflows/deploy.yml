name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish-images:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: auth-service,         context: services/auth-service }
          - { name: user-service,         context: services/user-service }
          - { name: startup-service,      context: services/startup-service }
          - { name: post-service,         context: services/post-service }
          - { name: notification-service, context: services/notification-service }
          - { name: chat-service,         context: services/chat-service }
          - { name: api-gateway,          context: infrastructure/api-gateway }
          - { name: config-server,        context: infrastructure/config-server }
          - { name: frontend,             context: frontend }
    steps:
      - uses: actions/checkout@v4

      - name: Image prefix (GHCR requires lowercase)
        run: echo "IMAGE_PREFIX=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/founderssync" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          # Only used by the frontend Dockerfile; ignored by the others.
          build-args: |
            NEXT_PUBLIC_HOST_GATEWAY_API_URL=${{ vars.PUBLIC_API_URL || 'http://localhost:8080' }}
            NEXT_PUBLIC_SERVER_URL=${{ vars.PUBLIC_API_URL || 'http://localhost:8080' }}
            NEXT_PUBLIC_ASSET_URL=${{ vars.PUBLIC_API_URL || 'http://localhost:8080' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to VM
    needs: publish-images
    # Opt-in: set repository variable DEPLOY_ENABLED=true once a VM exists.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Image prefix
        run: echo "IMAGE_PREFIX=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/founderssync" >> "$GITHUB_ENV"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ec2-user
          key: ${{ secrets.VM_SSH_KEY }}
          envs: IMAGE_PREFIX,IMAGE_TAG
          script: |
            set -euo pipefail
            cd /opt/founderssync
            git pull --ff-only
            export IMAGE_PREFIX IMAGE_TAG
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps